<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="staffGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6"/>

  <!-- Rod / Staff of Asclepius (Central Staff) -->
  <g filter="url(#glow)">
    <!-- Staff Top Knob -->
    <circle cx="256" cy="72" r="20" fill="url(#staffGrad)" stroke="#38bdf8" stroke-width="4"/>
    
    <!-- Main Rod -->
    <path d="M250 85 L250 440 A6 6 0 0 0 262 440 L262 85 Z" fill="url(#staffGrad)"/>
    <path d="M254 440 L256 465 L258 440 Z" fill="url(#staffGrad)"/>

    <!-- Coiled Serpent (Asclépio) -->
    <!-- Lower Loop -->
    <path d="M256 410 C210 410 200 370 230 340 C260 310 320 310 320 260 C320 210 260 210 230 180 C200 150 210 110 250 95" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="22" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Snake Head -->
    <path d="M248 95 C250 88 262 82 270 85 C278 88 280 100 274 106 C266 112 254 105 248 95 Z" fill="#38bdf8"/>
    <circle cx="266" cy="94" r="3" fill="#0f172a"/>
  </g>
</svg>
